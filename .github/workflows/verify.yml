name: Verify

# Builds and runs the API and the dashboard on Linux, the way the README says to
# run production: the API on SQLite and on Postgres, with the real data loaded.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/verify.yml'

jobs:
  api:
    name: API (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plants
          POSTGRES_PASSWORD: plants_ci_only
          POSTGRES_DB: plants_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plants"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 3333
      APP_URL: http://127.0.0.1:3333
      LOG_LEVEL: info
      SESSION_DRIVER: cookie
      LIMITER_STORE: database
      MAIL_TRANSPORT: smtp
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      MAIL_FROM: ci@example.test
      WEB_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install and type-check
        run: |
          npm ci
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Production install (as the README does)
        working-directory: api/build
        run: npm ci --omit=dev

      - name: Configure
        working-directory: api/build
        run: |
          echo "APP_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")" >> "$GITHUB_ENV"
          if [ "${{ matrix.db }}" = "postgres" ]; then
            {
              echo "DB_CONNECTION=pg"
              echo "DB_HOST=127.0.0.1"
              echo "DB_PORT=5432"
              echo "DB_USER=plants"
              echo "DB_PASSWORD=plants_ci_only"
              echo "DB_DATABASE=plants_ci"
            } >> "$GITHUB_ENV"
          else
            echo "SQLITE_PATH=${{ runner.temp }}/plants.sqlite3" >> "$GITHUB_ENV"
          fi

      - name: Migrate
        working-directory: api/build
        run: node ace migration:run --force

      - name: Load the data
        working-directory: api/build
        run: node ace data:setup --publish

      - name: Start the server
        working-directory: api/build
        run: |
          node bin/server.js > "${{ runner.temp }}/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3333/api/v1/health && break
            sleep 1
          done

      - name: Health, readiness and one monitor run
        working-directory: api/build
        run: |
          curl -sf http://127.0.0.1:3333/api/v1/health
          curl -sf http://127.0.0.1:3333/api/v1/health/ready
          node ace monitor:run --once --url http://127.0.0.1:3333
          curl -sf http://127.0.0.1:3333/api/v1/status | grep -q '"stale":false'

      - name: Server log
        if: always()
        run: tail -n 40 "${{ runner.temp }}/server.log" || true

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run build
